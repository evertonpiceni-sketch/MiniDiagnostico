<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste • Mini Diagnóstico</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f6f1ed;color:#302535;min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,440px);background:#fff;padding:32px;border-radius:24px;box-shadow:0 18px 60px #3c24451c}h1{text-align:center;font-family:Georgia,serif;color:#4d244f}p{text-align:center;color:#6c6269;line-height:1.5}label{display:block;margin:16px 0 6px;font-weight:700}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #d9d0d5;border-radius:12px;font-size:16px}button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:12px;background:#4d244f;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.msg{min-height:22px;margin-top:16px;font-size:14px}.ok{color:#176c49}.err{color:#a32929}</style></head><body><main class="card"><h1>Modo Técnico de Teste</h1><p>Área protegida para testar o Mini Diagnóstico completo, desde o início, sem gerar cobrança real no Asaas.</p><form id="f"><label for="username">Usuário</label><input id="username" value="janainateste" required autocomplete="username"><label for="password">Senha</label><input id="password" type="password" required autocomplete="current-password"><button id="b">INICIAR TESTE COMPLETO</button><p id="m" class="msg"></p></form></main><script>const f=document.getElementById('f'),m=document.getElementById('m'),b=document.getElementById('b');f.onsubmit=async e=>{e.preventDefault();m.className='msg';m.textContent='Validando...';b.disabled=true;try{const username=document.getElementById('username').value.trim().toLowerCase(),password=document.getElementById('password').value;const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha no login.');if(d.role!=='test')throw new Error('Este acesso não pertence ao modo de teste.');sessionStorage.clear();localStorage.removeItem('quiz_session_id');localStorage.removeItem('janaina_resultado');sessionStorage.setItem('admin_token',d.admin_token);sessionStorage.setItem('admin_role',d.role);sessionStorage.setItem('admin_username',d.username);sessionStorage.setItem('technical_test_fresh','1');history.replaceState({},'',location.pathname);m.className='msg ok';m.textContent='Login validado. Iniciando teste desde a primeira tela...';window.location.replace('/?test_mode=1&fresh=1')}catch(x){m.className='msg err';m.textContent=x.message||'Erro inesperado.';b.disabled=false}};</script></body></html>

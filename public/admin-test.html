<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teste • Mini Diagnóstico</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f6f1ed;color:#302535;min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,440px);background:#fff;padding:32px;border-radius:24px;box-shadow:0 18px 60px #3c24451c}h1{text-align:center;font-family:Georgia,serif;color:#4d244f}p{text-align:center;color:#6c6269;line-height:1.5}label{display:block;margin:16px 0 6px;font-weight:700}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #d9d0d5;border-radius:12px;font-size:16px}button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:12px;background:#4d244f;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.preview{display:none;margin-top:22px;padding-top:20px;border-top:1px solid #e5dce1}.preview h2{text-align:center;font:700 18px Georgia,serif;color:#4d244f}.preview button{background:#fff;color:#4d244f;border:1px solid #4d244f}.msg{min-height:22px;margin-top:16px;font-size:14px}.ok{color:#176c49}.err{color:#a32929}</style></head><body><main class="card"><h1>Modo Técnico de Teste</h1><p>Área protegida para testar o Mini Diagnóstico completo e visualizar os três resultados sem gerar cobrança real no Asaas.</p><form id="f"><label for="username">Usuário</label><input id="username" value="janainateste" required autocomplete="username"><label for="password">Senha</label><input id="password" type="password" required autocomplete="current-password"><button id="b">ENTRAR NA ÁREA DE TESTES</button><p id="m" class="msg"></p></form><section id="preview" class="preview"><h2>Escolha o teste</h2><button data-mode="full">TESTE COMPLETO — 12 PERGUNTAS</button><button data-id="00000000-0000-0000-0000-000000000001">VISUALIZAR RESULTADO — MEDO</button><button data-id="00000000-0000-0000-0000-000000000002">VISUALIZAR RESULTADO — INSEGURANÇA</button><button data-id="00000000-0000-0000-0000-000000000003">VISUALIZAR RESULTADO — PROCRASTINAÇÃO</button></section></main><script>const f=document.getElementById('f'),m=document.getElementById('m'),b=document.getElementById('b'),preview=document.getElementById('preview');function beginFull(){sessionStorage.setItem('technical_test_fresh','1');localStorage.removeItem('quiz_session_id');localStorage.removeItem('janaina_resultado');location.replace('/?test_mode=1&fresh=1')}f.onsubmit=async e=>{e.preventDefault();m.className='msg';m.textContent='Validando...';b.disabled=true;try{const username=document.getElementById('username').value.trim().toLowerCase(),password=document.getElementById('password').value;const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha no login.');if(d.role!=='test')throw new Error('Este acesso não pertence ao modo de teste.');sessionStorage.clear();sessionStorage.setItem('admin_token',d.admin_token);sessionStorage.setItem('admin_role',d.role);sessionStorage.setItem('admin_username',d.username);m.className='msg ok';m.textContent='Acesso liberado. Escolha abaixo o que deseja testar.';f.style.display='none';preview.style.display='block'}catch(x){m.className='msg err';m.textContent=x.message||'Erro inesperado.';b.disabled=false}};preview.onclick=e=>{const el=e.target.closest('button');if(!el)return;if(el.dataset.mode==='full')return beginFull();const id=el.dataset.id;if(!id)return;location.replace('/resultado?admin_test=1&session_id='+encodeURIComponent(id))};</script></body></html>

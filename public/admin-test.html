<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADM • Mini Diagnóstico</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f6f1ed;color:#302535;min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,440px);background:#fff;padding:32px;border-radius:24px;box-shadow:0 18px 60px #3c24451c}.logo{display:block;max-width:190px;margin:0 auto 24px}h1{text-align:center;font-family:Georgia,serif;color:#4d244f}p{text-align:center;color:#6c6269;line-height:1.5}label{display:block;margin:16px 0 6px;font-weight:700}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #d9d0d5;border-radius:12px;font-size:16px}button{width:100%;margin-top:22px;padding:15px;border:0;border-radius:12px;background:#4d244f;color:#fff;font-weight:700;font-size:16px;cursor:pointer}.msg{min-height:22px;margin-top:16px;font-size:14px}.ok{color:#176c49}.err{color:#a32929}</style></head><body><main class="card"><img class="logo" src="/ja-logo-approved.webp" alt="Janaína Araújo"><h1>Modo ADM de Teste</h1><p>Libera somente uma sessão informada para conferência, sem criar cobrança no Asaas.</p><form id="f"><label for="sid">ID da sessão</label><input id="sid" required autocomplete="off"><label for="secret">Senha ADM</label><input id="secret" type="password" required autocomplete="current-password"><button id="b">LIBERAR RESULTADO DE TESTE</button><p id="m" class="msg"></p></form></main><script>const f=document.getElementById('f'),m=document.getElementById('m'),b=document.getElementById('b');f.onsubmit=async e=>{e.preventDefault();m.className='msg';m.textContent='Validando...';b.disabled=true;try{const sid=document.getElementById('sid').value.trim(),secret=document.getElementById('secret').value;const r=await fetch('/api/admin-test',{method:'POST',headers:{'Content-Type':'application/json','x-admin-test-secret':secret},body:JSON.stringify({quiz_session_id:sid})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha no acesso ADM.');sessionStorage.setItem('result_token',d.token);localStorage.setItem('quiz_session_id',sid);m.className='msg ok';m.textContent='Sessão liberada. Abrindo o resultado...';location.href='/resultado?session_id='+encodeURIComponent(sid)+'&token='+encodeURIComponent(d.token)}catch(x){m.className='msg err';m.textContent=x.message||'Erro inesperado.';b.disabled=false}};</script></body></html>

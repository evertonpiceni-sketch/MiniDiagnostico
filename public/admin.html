<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADM Janaína • Mini Diagnóstico</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f6f1ed;color:#302535;min-height:100vh;display:grid;place-items:center}.card{width:min(92vw,560px);background:#fff;padding:30px;border-radius:24px;box-shadow:0 18px 60px #3c24451c}h1{text-align:center;font-family:Georgia,serif;color:#4d244f}p{text-align:center;color:#6c6269;line-height:1.5}label{display:block;margin:16px 0 6px;font-weight:700}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #d9d0d5;border-radius:12px;font-size:16px}button,.open{display:block;box-sizing:border-box;width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;background:#4d244f;color:#fff;font-weight:700;font-size:16px;text-align:center;text-decoration:none;cursor:pointer}.msg{min-height:22px;margin-top:14px;font-size:14px}.ok{color:#176c49}.err{color:#a32929}.hidden{display:none}.item{border:1px solid #e5dde2;border-radius:14px;padding:14px;margin-top:12px}.item p{text-align:left;margin:5px 0}.pending{color:#9a6517}.paid{color:#176c49}</style></head><body><main class="card"><section id="login"><h1>Área Administrativa</h1><p>Acesso de Janaína para suporte aos clientes. Este perfil é somente leitura e não altera pagamentos.</p><form id="f"><label>Usuário</label><input id="username" value="janainabrandao" required autocomplete="username"><label>Senha</label><input id="password" type="password" required autocomplete="current-password"><button>ENTRAR</button><p id="m" class="msg"></p></form></section><section id="panel" class="hidden"><h1>Painel da Janaína</h1><p>Localize um diagnóstico pelo WhatsApp do cliente ou pelo ID da sessão.</p><form id="s"><label>WhatsApp ou ID da sessão</label><input id="query" required><button>BUSCAR DIAGNÓSTICO</button></form><p id="sm" class="msg"></p><div id="results"></div><button id="logout" type="button">SAIR</button></section></main><script>const $=id=>document.getElementById(id),login=$('login'),panel=$('panel'),m=$('m'),sm=$('sm'),results=$('results');let token=sessionStorage.getItem('admin_token')||'';function showPanel(){login.classList.add('hidden');panel.classList.remove('hidden')}if(token&&sessionStorage.getItem('admin_role')==='support')showPanel();$('f').onsubmit=async e=>{e.preventDefault();m.textContent='Validando...';try{const r=await fetch('/api/admin-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value.trim().toLowerCase(),password:$('password').value})}),d=await r.json();if(!r.ok||d.role!=='support')throw new Error(d.error||'Acesso inválido.');token=d.admin_token;sessionStorage.setItem('admin_token',token);sessionStorage.setItem('admin_role','support');showPanel()}catch(x){m.className='msg err';m.textContent=x.message}};$('s').onsubmit=async e=>{e.preventDefault();sm.textContent='Consultando...';results.innerHTML='';try{const r=await fetch('/api/admin-support',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({query:$('query').value.trim()})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Falha na consulta.');sm.textContent=d.results.length?d.results.length+' registro(s) encontrado(s).':'Nenhum diagnóstico encontrado.';d.results.forEach(x=>{const el=document.createElement('div');el.className='item';el.innerHTML='<p><b>'+esc(x.nome)+'</b></p><p>'+esc(x.whatsapp||'')+'</p><p>Padrão: '+esc(x.resultado_dominante||'—')+'</p><p class="'+(x.payment_status==='paid'?'paid':'pending')+'">Pagamento: '+(x.payment_status==='paid'?'CONFIRMADO':'PENDENTE')+'</p>';if(x.result_token){const a=document.createElement('a');a.className='open';a.textContent='ABRIR RESULTADO PAGO';a.href='/resultado?session_id='+encodeURIComponent(x.quiz_session_id)+'&token='+encodeURIComponent(x.result_token);el.appendChild(a)}results.appendChild(el)})}catch(x){sm.className='msg err';sm.textContent=x.message}};function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('logout').onclick=()=>{sessionStorage.removeItem('admin_token');sessionStorage.removeItem('admin_role');location.reload()}</script></body></html>

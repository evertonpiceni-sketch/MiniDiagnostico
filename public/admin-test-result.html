ml');const id=new URLSearchParams(location.search).get('session_id');if(!id)return document.getElementById('app').innerHTML='<p class="err">Sessão de teste não informada.</p>';try{const r=await fetch('/api/admin-test',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({quiz_session_id:id})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha ao carregar teste.');const q=d.result,pattern=q.resultado_dominante,c=COPY[pattern];if(!c)throw new Error('Resultado não reconhecido.');const name=String(q.nome||'').trim();const msg=`Olá, Janaína! 🌿\nAcabei de concluir o Mini Diagnóstico e meu resultado trouxe alguns pontos que fizeram sentido para mim.\n\nGostaria de compreender melhor o que apareceu e saber como posso aprofundar esse processo com o seu acompanhamento.\n\nMeu nome é ${name} e meu padrão predominante foi ${pattern}.\n\nVim pelo Mini Diagnóstico — Janaína Araújo. 💜`;const app=document.getElementById('app');app.dataset.pattern=pattern;app.dataset.approved='1';app.innerHTML=`<header class="approved-result-hero"><img src="/ja-logo-approved.webp" alt="Janaína Araújo"><div><small>MINI DIAGNÓSTICO</small><b>SUAS RESPOSTAS, SEU MAPA INTERIOR</b></div><p>SEU PADRÃO PREDOMINANTE É:</p><h1>${esc(pattern)}</h1><em>${esc(c.intro)}</em></header><main class="approved-result-body"><section class="result-wide"><h3>INTERPRETAÇÃO DO SEU RESULTADO</h3><p>${esc(c.interpretation)}</p></section><div class="result-grid"><section><h3>SINAIS COMUNS</h3>${list(c.signs)}</section><section><h3>O QUE ISSO PODE CAUSAR</h3>${list(c.effects)}</section></div><section class="result-wide result-path"><h3>SEU CAMINHO DE TRANSFORMAÇÃO</h3><p>${esc(c.path)}</p></section><section class="result-wide result-practices"><h3>PRÁTICAS SUGERIDAS</h3><ul>${c.practices.map(x=>`<li>✓ ${esc(x)}</li>`).join('')}</ul></section><blockquote>“ ${esc(c.quote)} ”</blockquote><a class="result-whatsapp" href="https://wa.me/5521983928113?text=${enco

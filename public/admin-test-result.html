<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Diagnóstico — Resultado</title><style>*{box-sizing:border-box}body{margin:0;background:#f4eee6;color:#241d29;font-family:Georgia,'Times New Roman',serif}.card{width:100%;max-width:760px;margin:auto;min-height:100vh;overflow:hidden;background:#fffaf2;box-shadow:0 20px 70px #3d2c1d22}.hero{position:relative;min-height:420px;padding:28px 32px 30px;text-align:center;background-size:cover;background-position:center}.hero:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,248,230,.10),rgba(255,255,255,.20));pointer-events:none}.hero>*{position:relative;z-index:1}.hero.medo{background:linear-gradient(180deg,rgba(255,224,153,.25),rgba(250,216,154,.5)),url('/result-medo.webp') center/cover}.hero.inseguranca{background:linear-gradient(180deg,rgba(244,218,255,.22),rgba(239,212,248,.52)),url('/result-inseguranca.webp') center/cover}.hero.procrastinacao{background:linear-gradient(180deg,rgba(218,246,242,.2),rgba(212,238,228,.52)),url('/result-procrastinacao.webp') center/cover}.brand{display:flex;justify-content:center;align-items:center;gap:12px}.brand img{width:100px;height:auto}.brand-title{text-align:left}.brand-title strong{display:block;font-size:29px}.brand-title span{font:800 8px Arial,sans-serif;letter-spacing:.17em}.motto{position:absolute!important;right:30px;top:70px;width:145px;font-size:18px;font-style:italic;transform:rotate(-5deg)}.hero-label{margin:85px 0 6px;font:800 12px Arial,sans-serif;letter-spacing:.08em}.hero h1{font-size:clamp(48px,9vw,68px);line-height:.95;margin:0 0 8px}.hero.medo h1{color:#8a601e}.hero.inseguranca h1{color:#6b207b}.hero.procrastinacao h1{color:#075754}.intro{max-width:500px;margin:0 auto;font-size:17px;line-height:1.35}.body{padding:12px 22px 20px;background:linear-gradient(180deg,#fffaf0,#fffdf8)}.box{border:1px solid #e8ded2;border-radius:14px;padding:15px 17px;background:rgba(255,255,255,.86);margin-top:10px}.box h3{font:800 13px Arial,sans-serif;margin:0 0 8px;color:#432f3e}.box p,.box li{font-size:14px;line-height:1.4}.box p{margin:0}.box ul{margin:0;padding-left:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.path{background:#eef5e9}.practices{background:#f6eafa}.quote{border-radius:13px;padding:18px;margin:12px 0 0;text-align:center;color:#fff;font-size:19px;font-style:italic;background:#56331e}.card[data-pattern='INSEGURANÇA'] .quote{background:#572d6e}.card[data-pattern='PROCRASTINAÇÃO'] .quote{background:#075754}.wa,.pdf{display:flex;align-items:center;justify-content:center;text-decoration:none;text-align:center;min-height:55px;margin-top:10px;border-radius:13px;font:800 13px Arial,sans-serif}.wa{background:#079b4d;color:#fff}.pdf{background:#fff;color:#151a24;border:1.5px solid #1e2e2c}.footer{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;padding:18px 26px;background:#fff7e8;border-top:1px solid #ead9b9}.footer img{width:72px}.footer b{font-size:19px}.footer span,.footer small{display:block;font:700 8px Arial,sans-serif;letter-spacing:.1em;margin-top:4px}.err{padding:40px;text-align:center;color:#a32929}@media(max-width:640px){.hero{min-height:340px;padding:20px 14px}.brand img{width:80px}.brand-title strong{font-size:23px}.motto{right:12px;top:72px;width:105px;font-size:14px}.hero-label{margin-top:70px}.hero h1{font-size:44px}.intro{font-size:15px}.body{padding:9px}.box{padding:12px}.box p,.box li{font-size:13px}.grid{gap:7px}.footer{padding:14px}.footer img{width:58px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.motto{display:none}.hero-label{margin-top:48px}}@media print{body{background:#fff}.card{box-shadow:none}.wa,.pdf{display:none}}</style></head><body><article class="card" id="app"><p style="text-align:center;padding:35px">Carregando seu resultado...</p></article><script>const C={MEDO:{motto:'Com consciência, a vida flui com mais leveza.',intro:'O medo é uma forma de proteção. A diferença está em não deixar que ele defina todos os seus caminhos.',interpretation:'Suas respostas sugerem que o medo pode estar ocupando um espaço importante na sua vida, como forma de evitar riscos ou situações novas. Ele pode aparecer como preocupação excessiva, antecipação de problemas, dificuldade para tomar decisões ou necessidade de ter certeza antes de avançar.',signs:['Pensamentos que começam com “e se...?”','Tendência a imaginar o pior cenário','Necessidade de controle','Evita oportunidades por receio das consequências'],effects:['Ansiedade e tensão constante','Dificuldade em tomar decisões','Perda de oportunidades','Sensação de estagnação','Desgaste emocional'],path:'Desenvolver segurança interna antes de exigir de si coragem absoluta. Em vez de esperar o medo desaparecer, experimente perguntar: “Qual é o menor passo seguro que posso dar mesmo sentindo medo?”',practices:['Respiração consciente (3 minutos, 2x ao dia)','Identifique o que o medo está tentando proteger','Faça pequenas ações fora da sua zona de conforto','Registre seus avanços, por menores que sejam'],quote:'Coragem não é a ausência do medo, mas a decisão de seguir em frente, mesmo sentindo.'},'INSEGURANÇA':{motto:'Você já é suficiente, exatamente como é.',intro:'A insegurança pode fazer você duvidar do seu valor, mas não define quem você é. Reconhecer suas conquistas é o primeiro passo para se fortalecer.',interpretation:'Suas respostas indicam que a percepção sobre si mesmo pode estar interferindo em algumas escolhas. A insegurança pode surgir através da comparação, do medo de errar ou da necessidade de aprovação. Ao reconhecer isso, você pode resgatar sua confiança interna e agir com mais autenticidade.',signs:['Autocrítica intensa','Comparação frequente','Dificuldade em receber elogios','Necessidade de confirmação externa','Abandona ideias por duvidar de si'],effects:['Baixa autoestima','Perda de oportunidades','Dependência da aprovação alheia','Sensação de não ser suficiente','Desgaste emocional e frustração'],path:'Construir referências internas de valor. Antes de perguntar “será que vão aprovar?”, experimente perguntar: “Isso faz sentido para mim e está alinhado com quem quero ser?”',practices:['Registre 3 conquistas diárias (por menores que sejam)','Identifique e questione sua voz crítica','Pratique o autocuidado sem cobrança','Cerque-se de pessoas que te apoiam e valorizam'],quote:'Você não precisa ser perfeito, precisa ser verdadeiro.'},'PROCRASTINAÇÃO':{motto:'Pequenos passos, grandes conquistas.',intro:'Não é preguiça. É um sinal de que algo precisa ser compreendido. Você pode avançar, no seu tempo, do seu jeito, com mais leveza.',interpretation:'Suas respostas sugerem uma tendência ao adiamento de determinadas ações. A procrastinação nem sempre significa falta de vontade. Ela pode aparecer quando uma tarefa desperta desconforto, medo de falhar, perfeccionismo, insegurança ou sensação de sobrecarga. É importante compreender o que acontece emocionalmente antes do adiamento.',signs:['Tarefas constantemente adiadas','Espera pelo “momento certo”','Dificuldade para começar','Muitas ideias e pouca execução','Sensação de culpa depois de adiar'],effects:['Acúmulo de responsabilidades','Ansiedade e estresse','Frustração com você mesmo','Perda de oportunidades','Sensação de estar sempre “atrasado”'],path:'Diminuir o tamanho psicológico da tarefa. Em vez de perguntar “como termino tudo?”, experimente: “qual parte disso consigo começar nos próximos dez minutos?”',practices:['Divida grandes tarefas em passos pequenos','Use a técnica dos 10 minutos (comece sem se cobrar tanto)','Elimine distrações no momento da ação','Celebre cada etapa concluída','Observe e acolha as emoções que surgem antes do adiamento'],quote:'Disciplina é escolher o que você mais quer, no lugar do que você quer agora.'}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const list=a=>'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';(async()=>{const token=sessionStorage.getItem('admin_token');if(!token||sessionStorage.getItem('admin_role')!=='test')return location.replace('/admin-test.html');const id=new URLSearchParams(location.search).get('session_id');if(!id)return app.innerHTML='<p class="err">Sessão de teste não informada.</p>';try{const r=await fetch('/api/admin-test',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({quiz_session_id:id})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha ao carregar teste.');const q=d.result,p=q.resultado_dominante,c=C[p];if(!c)throw new Error('Resultado não reconhecido.');const cls=p==='MEDO'?'medo':p==='INSEGURANÇA'?'inseguranca':'procrastinacao';const name=String(q.nome||'').trim();const msg=`Olá, Janaína! 🌿\nAcabei de concluir o Mini Diagnóstico e meu resultado trouxe alguns pontos que fizeram sentido para mim.\n\nGostaria de compreender melhor o que apareceu e saber como posso aprofundar esse processo com o seu acompanhamento.\n\nMeu nome é ${name} e meu padrão predominante foi ${p}.\n\nVim pelo Mini Diagnóstico — Janaína Araújo. 💜`;const app=document.getElementById('app');app.dataset.pattern=p;app.innerHTML=`<header class="hero ${cls}"><div class="brand"><img src="/ja-logo-approved.webp" alt="Janaína Araújo"><div class="brand-title"><strong>Mini Diagnóstico</strong><span>SUAS RESPOSTAS, SEU MAPA INTERIOR</span></div></div><div class="motto">${esc(c.motto)}</div><p class="hero-label">SEU PADRÃO PREDOMINANTE É:</p><h1>${esc(p)}</h1><p class="intro">${esc(c.intro)}</p></header><main class="body"><section class="box"><h3>INTERPRETAÇÃO DO SEU RESULTADO</h3><p>${esc(c.interpretation)}</p></section><div class="grid"><section class="box"><h3>SINAIS COMUNS</h3>${list(c.signs)}</section><section class="box"><h3>O QUE ISSO PODE CAUSAR</h3>${list(c.effects)}</section></div><section class="box path"><h3>SEU CAMINHO DE TRANSFORMAÇÃO</h3><p>${esc(c.path)}</p></section><section class="box practices"><h3>PRÁTICAS SUGERIDAS</h3>${list(c.practices)}</section><blockquote class="quote">“ ${esc(c.quote)} ”</blockquote><a class="wa" href="https://wa.me/5521983928113?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">QUERO APROFUNDAR MEU RESULTADO COM JANAÍNA</a><a class="pdf" href="#" onclick="window.print();return false">↓ &nbsp; BAIXAR MEU RESULTADO EM PDF</a></main><footer class="footer"><img src="/ja-logo-approved.webp" alt="Janaína Araújo"><div><b>Janaína Araújo</b><span>TERAPEUTA INTEGRATIVA</span><span>AUTOCONHECIMENTO • EQUILÍBRIO • TRANSFORMAÇÃO</span><small>JUNTOS SOMOS MELHORES ♡</small></div></footer>`}catch(e){document.getElementById('app').innerHTML='<p class="err">'+esc(e.message||'Falha ao carregar teste.')+'</p>'}})();</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Diagnóstico — Resultado</title><style>*{box-sizing:border-box}html,body{margin:0;background:#eee7dd}body{display:flex;justify-content:center}.sheet{position:relative;width:min(100vw,512px);aspect-ratio:1/2;overflow:hidden;background:#fff}.art{position:absolute;inset:0;width:300%;height:100%;max-width:none}.art.medo{transform:translateX(0)}.art.inseguranca{transform:translateX(-33.333333%)}.art.procrastinacao{transform:translateX(-66.666667%)}.hit{position:absolute;left:13%;width:74%;z-index:3;border-radius:14px}.wa{top:80.3%;height:5.4%}.pdf{top:86.1%;height:4.4%}.err{font:16px Arial,sans-serif;padding:40px;text-align:center;color:#a32929}@media(min-width:513px){.sheet{box-shadow:0 20px 70px #2b1e1528}}@media print{body{background:#fff}.sheet{width:100%;box-shadow:none}.hit{display:none}}</style></head><body><main class="sheet" id="app"><p class="err">Carregando seu resultado...</p></main><script>const ART='/approved-results-reference.webp';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));(async()=>{const app=document.getElementById('app'),token=sessionStorage.getItem('admin_token');if(!token||sessionStorage.getItem('admin_role')!=='test')return location.replace('/admin-test.html');const id=new URLSearchParams(location.search).get('session_id');if(!id)return app.innerHTML='<p class="err">Sessão de teste não informada.</p>';try{const r=await fetch('/api/admin-test',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({quiz_session_id:id})}),d=await r.json();if(!r.ok)throw new Error(d.error||'Falha ao carregar teste.');const q=d.result,p=q.resultado_dominante,cls=p==='MEDO'?'medo':p==='INSEGURANÇA'?'inseguranca':p==='PROCRASTINAÇÃO'?'procrastinacao':'';if(!cls)throw new Error('Resultado não reconhecido.');const msg=`Olá, Janaína! 🌿\nAcabei de concluir o Mini Diagnóstico e meu resultado trouxe alguns pontos que fizeram sentido para mim.\n\nGostaria de compreender melhor o que apareceu e saber como posso aprofundar esse processo com o seu acompanhamento.\n\nMeu nome é ${String(q.nome||'').trim()} e meu padrão predominante foi ${p}.\n\nVim pelo Mini Diagnóstico — Janaína Araújo. 💜`;app.innerHTML=`<img class="art ${cls}" src="${ART}" alt="Resultado ${esc(p)}"><a class="hit wa" aria-label="Quero aprofundar meu resultado com Janaína" href="https://wa.me/5521983928113?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener"></a><a class="hit pdf" aria-label="Baixar meu resultado em PDF" href="#" onclick="window.print();return false"></a>`}catch(e){app.innerHTML='<p class="err">'+esc(e.message||'Falha ao carregar teste.')+'</p>'}})();</script></body></html>

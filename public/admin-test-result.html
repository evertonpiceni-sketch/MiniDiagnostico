<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resultado de Teste</title><style>:root{--cream:#fff8eb;--paper:#fffdf8;--plum:#71306d;--plumDark:#552252;--ink:#302535}*{box-sizing:border-box}body{margin:0;background:#f6eee6;color:var(--ink);font-family:Georgia,'Times New Roman',serif}.wrap{max-width:760px;margin:auto;padding:12px}.card{background:var(--paper);overflow:hidden;box-shadow:0 18px 55px #4a3d2918}.tech{display:block;background:var(--plumDark);color:#fff;padding:10px 18px;text-align:center;font-family:Arial,sans-serif;font-size:11px;font-weight:800;letter-spacing:.03em}.hero{text-align:center;padding:18px 24px 24px;background:linear-gradient(180deg,#eaf8f5,#d8eee8)}.hero.medo{background:linear-gradient(180deg,#fff8e6,#f5dfbd)}.hero.inseguranca{background:linear-gradient(180deg,#f8ebff,#ead9f2)}.logo{width:110px;height:auto;margin:0 auto 4px}.mini{font-size:29px;font-weight:700;margin:0}.tag{font-family:Arial,sans-serif;font-size:9px;letter-spacing:.16em;font-weight:800}.hello{font-family:Arial,sans-serif;margin:14px 0 5px}.label{font-family:Arial,sans-serif;font-size:12px;letter-spacing:.08em;font-weight:700;margin:8px 0}.hero h1{font-size:clamp(42px,9vw,62px);line-height:1;margin:7px 0;color:#075754}.hero.medo h1{color:#7a5417}.hero.inseguranca h1{color:#622477}.intro{max-width:570px;margin:10px auto 0;font-size:17px;line-height:1.35}.body{padding:12px 18px 18px}.box{background:#fffdf9;border:1px solid #eadfdb;border-radius:14px;padding:16px;margin-top:10px;line-height:1.4}.box h3{font-family:Arial,sans-serif;margin:0 0 8px;color:var(--plumDark);font-size:14px}.box p{margin:0}.box ul{margin:0;padding-left:20px}.box li{margin:5px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.path{background:#f1f7ed}.practices{background:#f6eef8}.quote{background:var(--plumDark);color:#fff;text-align:center;font-style:italic;font-size:18px}.cta{text-align:center;font-family:Arial,sans-serif;font-size:14px;line-height:1.45;margin:14px auto 8px;max-width:560px}.actions{display:grid;gap:8px}.actions a{font-family:Arial,sans-serif;min-height:50px;display:flex;align-items:center;justify-content:center;padding:10px 15px;border-radius:12px;text-align:center;text-decoration:none;font-weight:800}.wa{background:#08a64f;color:#fff}.pdf{background:#fff;color:#173e39;border:1px solid #315d54}.new{background:var(--plum);color:#fff}.exit{background:#eee6eb;color:var(--plumDark)}.footer{text-align:center;padding:18px;background:#fff8e9;color:#5d4631}.footer b{display:block;font-size:21px}.footer span,.footer small{font-family:Arial,sans-serif;display:block;margin-top:4px;font-size:8px;letter-spacing:.12em;font-weight:800}.err{padding:35px;color:#a32929;text-align:center}@media(max-width:600px){.wrap{padding:0}.card{min-height:100vh}.grid{grid-template-columns:1fr 1fr;gap:7px}.body{padding:9px}.box{padding:12px;font-size:13px}.box h3{font-size:12px}.hero{padding:15px 12px 18px}.hero h1{font-size:40px}.intro{font-size:15px}.actions a{font-size:12px}.footer{padding:15px 8px}}@media(max-width:390px){.grid{grid-template-columns:1fr}.box{font-size:14px}}</style></head><body><div class="wrap"><div class="card" id="app"><span class="tech">MODO TÉCNICO • PAGAMENTO SIMULADO • ASAAS NÃO ACIONADO</span><p style="text-align:center;padding:30px">Carregando resultado de teste...</p></div></div><script>const C={MEDO:{intro:'O medo é uma forma de proteção. A diferença está em não deixar que ele defina todos os seus caminhos.',interpretation:'Suas respostas sugerem que o medo pode estar ocupando um espaço importante na sua vida, como forma de evitar riscos ou situações novas. Ele pode aparecer como preocupação excessiva, antecipação de problemas, dificuldade para tomar decisões ou necessidade de ter certeza antes de avançar.',signs:['Pensamentos que começam com “e se...?”','Tendência a imaginar o pior cenário','Necessidade de controle','Evita oportunidades por receio das consequências'],effects:['Ansiedade e tensão constante','Dificuldade em tomar decisões','Perda de oportunidades','Sensação de estagnação','Desgaste emocional'],path:'Desenvolver segurança interna antes de exigir de si coragem absoluta. Em vez de esperar o medo desaparecer, experimente perguntar: “Qual é o menor passo seguro que posso dar mesmo sentindo medo?”',practices:['Respiração consciente (3 minutos, 2x ao dia)','Identifique o que o medo está tentando proteger','Faça pequenas ações fora da sua zona de conforto','Registre seus avanços, por menores que sejam'],quote:'Coragem não é a ausência do medo, mas a decisão de seguir em frente, mesmo sentindo.'},'INSEGURANÇA':{intro:'A insegurança pode fazer você duvidar do seu valor, mas não define quem você é. Reconhecer suas conquistas é o primeiro passo para se fortalecer.',interpretation:'Suas respostas indicam que a percepção sobre si mesmo pode estar interferindo em algumas escolhas. A insegurança pode surgir através da comparação, do medo de errar ou da necessidade de aprovação. Ao reconhecer isso, você pode resgatar sua confiança interna e agir com mais autenticidade.',signs:['Autocrítica intensa','Comparação frequente','Dificuldade em receber elogios','Necessidade de confirmação externa','Abandona ideias por duvidar de si'],effects:['Baixa autoestima','Perda de oportunidades','Dependência da aprovação alheia','Sensação de não ser suficiente','Desgaste emocional e frustração'],path:'Construir referências internas de valor. Antes de perguntar “será que vão aprovar?”, experimente perguntar: “Isso faz sentido para mim e está alinhado com quem quero ser?”',practices:['Registre 3 conquistas diárias (por menores que sejam)','Identifique e questione sua voz crítica','Pratique o autocuidado sem cobrança','Cerque-se de pessoas que te apoiam e valorizam'],quote:'Você não precisa ser perfeito, precisa ser verdadeiro.'},'PROCRASTINAÇÃO':{intro:'Não é preguiça. É um sinal de que algo precisa ser compreendido. Você pode avançar, no seu tempo, do seu jeito, com mais leveza.',interpretation:'Suas respostas sugerem uma tendência ao adiamento de determinadas ações. A procrastinação nem sempre significa falta de vontade. Ela pode aparecer quando uma tarefa desperta desconforto, medo de falhar, perfeccionismo, insegurança ou sensação de sobrecarga. Compreender o que acontece emocionalmente antes do adiamento é mais importante do que simplesmente exigir mais disciplina.',signs:['Tarefas constantemente adiadas','Espera pelo “momento certo”','Dificuldade para começar','Muitas ideias e pouca execução','Sensação de culpa depois de adiar'],effects:['Acúmulo de responsabilidades','Ansiedade e estresse','Frustração com você mesmo','Perda de oportunidades','Sensação de estar sempre “atrasado”'],path:'Diminuir o tamanho psicológico da tarefa. Em vez de perguntar “como termino tudo?”, experimente: “Qual parte disso consigo começar nos próximos dez minutos?”',practices:['Divida grandes tarefas em passos pequenos','Use a técnica dos 10 minutos (comece sem se cobrar tanto)','Elimine distrações no momento da ação','Celebre cada etapa concluída','Observe e acolha as emoções que surgem antes do adiamento'],quote:'Disciplina é escolher o que você mais quer, no lugar do que você quer agora.'}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const list=a=>'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';(async()=>{const token=sessionStorage.getItem('admin_token');if(!token||sessionStorage.getItem('admin_role')!=='test')return location.replace('/admin-test.html');const id=new URLSearchParams(location.search).get('session_id');if(!id)return document.getElementById('app').innerHTML='<span class="tech">MODO TÉCNICO</span><p class="err">Sessão de teste não informada.</p>';try{const r=await fetch('/api/admin-test',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({quiz_session_id:id})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha ao carregar teste.');const q=d.result,c=C[q.resultado_dominante];if(!c)throw new Error('Resultado de teste não reconhecido.');const cls=q.resultado_dominante==='MEDO'?'medo':q.resultado_dominante==='INSEGURANÇA'?'inseguranca':'';const msg=`Olá, Janaína! Acabei de fazer o Mini Diagnóstico e meu resultado predominante foi ${q.resultado_dominante}. Gostaria de entender melhor o que esse resultado revela e saber como posso trabalhar esse padrão no meu processo de transformação. Você pode me orientar?`;document.getElementById('app').innerHTML='<span class="tech">MODO TÉCNICO • PAGAMENTO SIMULADO • ASAAS NÃO ACIONADO</span><header class="hero '+cls+'"><img class="logo" src="/ja-logo-approved.webp" alt="Janaína Araújo"><div class="mini">Mini Diagnóstico</div><div class="tag">SUAS RESPOSTAS, SEU MAPA INTERIOR</div><p class="hello">Olá, '+esc(q.nome)+'.</p><p class="label">SEU PADRÃO PREDOMINANTE É:</p><h1>'+esc(q.resultado_dominante)+'</h1><p class="intro">'+esc(c.intro)+'</p></header><main class="body"><section class="box"><h3>INTERPRETAÇÃO DO SEU RESULTADO</h3><p>'+esc(c.interpretation)+'</p></section><div class="grid"><section class="box"><h3>SINAIS COMUNS</h3>'+list(c.signs)+'</section><section class="box"><h3>O QUE ISSO PODE CAUSAR</h3>'+list(c.effects)+'</section></div><section class="box path"><h3>SEU CAMINHO DE TRANSFORMAÇÃO</h3><p>'+esc(c.path)+'</p></section><section class="box practices"><h3>PRÁTICAS SUGERIDAS</h3>'+list(c.practices)+'</section><section class="box quote">“'+esc(c.quote)+'”</section><p class="cta">Quer aprofundar seu resultado e receber uma orientação personalizada? Fale diretamente com Janaína.</p><div class="actions"><a class="wa" href="https://wa.me/5521983928113?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener noreferrer">◉ &nbsp; QUERO APROFUNDAR MEU RESULTADO COM JANAÍNA</a><a class="pdf" href="#" onclick="alert(\'No modo técnico, o PDF real permanece protegido pelo fluxo de pagamento.\');return false">⇩ &nbsp; BAIXAR MEU RESULTADO EM PDF</a><a class="new" href="/?test_mode=1">FAZER NOVO TESTE</a><a class="exit" href="/admin-test.html" onclick="sessionStorage.clear()">SAIR DO MODO DE TESTE</a></div></main><footer class="footer"><b>Janaína Araújo</b><span>TERAPEUTA INTEGRATIVA</span><span>AUTOCONHECIMENTO • EQUILÍBRIO • TRANSFORMAÇÃO</span><small>JUNTOS SOMOS MELHORES</small></footer>'}catch(e){document.getElementById('app').innerHTML='<span class="tech">MODO TÉCNICO</span><p class="err">'+esc(e.message||'Falha ao carregar teste.')+'</p>'}})();</script></body></html>

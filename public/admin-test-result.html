<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Diagnóstico — Resultado</title><style>:root{--ink:#312a27;--plum:#6b2871;--green:#075d57;--gold:#9a6b22}*{box-sizing:border-box}body{margin:0;background:#f4eee6;color:var(--ink);font-family:Georgia,'Times New Roman',serif}.wrap{max-width:760px;margin:auto}.card{min-height:100vh;background:#fffaf1;overflow:hidden;box-shadow:0 14px 50px #4d3b261c}.hero{position:relative;text-align:center;padding:22px 28px 26px;background:linear-gradient(180deg,#dff3f2,#edf8f2 55%,#fffaf0)}.hero.medo{background:linear-gradient(180deg,#fff1cf,#f9e5bd 55%,#fff8e9)}.hero.inseguranca{background:linear-gradient(180deg,#f1ddfa,#f4e5f7 55%,#fff8ef)}.logo{width:115px;height:auto;margin:0 auto 2px}.mini{font-size:30px;font-weight:700}.tag{font:800 9px Arial,sans-serif;letter-spacing:.15em}.hello{font:14px Arial,sans-serif;margin:10px 0 5px}.label{font:700 12px Arial,sans-serif;letter-spacing:.06em;margin:8px 0}.hero h1{font-size:clamp(43px,9vw,64px);line-height:.95;margin:7px 0;color:var(--green)}.hero.medo h1{color:#8a601e}.hero.inseguranca h1{color:var(--plum)}.intro{max-width:580px;margin:10px auto 0;font-size:17px;line-height:1.28}.body{padding:8px 18px 16px;background:linear-gradient(180deg,#fffaf0,#fffdf8)}.box{background:#fffdf8eF;border:1px solid #e8ded2;border-radius:13px;padding:14px 16px;margin-top:9px;line-height:1.32}.box h3{font:800 14px Arial,sans-serif;margin:0 0 7px;color:#433229}.inseguranca~.body .box h3{color:var(--plum)}.box p{margin:0}.box ul{margin:0;padding-left:20px}.box li{margin:4px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.path{background:#eef5e9}.practices{background:#f7edf8}.quote{background:linear-gradient(90deg,#5b3b20,#7a532b);color:#fff;text-align:center;font-style:italic;font-size:18px;border:0}.quote.purple{background:linear-gradient(90deg,#532466,#6c3478)}.quote.green{background:linear-gradient(90deg,#07544f,#087069)}.actions{display:grid;gap:8px;margin-top:9px}.actions a{font:800 13px Arial,sans-serif;min-height:50px;display:flex;align-items:center;justify-content:center;padding:10px 14px;border-radius:12px;text-align:center;text-decoration:none}.wa{background:#08a64f;color:#fff}.pdf{background:#fff;color:#1f302e;border:1px solid #315d54}.footer{text-align:center;padding:14px 10px 18px;background:#fff6e5;border-top:1px solid #ead9b9;color:#614c31}.footer b{display:block;font-size:20px}.footer span,.footer small{font:800 8px Arial,sans-serif;display:block;margin-top:3px;letter-spacing:.11em}.err{padding:40px;text-align:center;color:#a32929}@media(max-width:600px){.hero{padding:16px 13px 20px}.logo{width:98px}.mini{font-size:26px}.hero h1{font-size:42px}.intro{font-size:15px}.body{padding:7px 9px 14px}.box{padding:11px 12px;font-size:13px}.box h3{font-size:12px}.grid{gap:7px}.actions a{font-size:12px}.footer{padding:12px 8px 15px}}@media(max-width:360px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card" id="app"><p style="text-align:center;padding:35px">Carregando seu resultado...</p></div></div><script>const C={MEDO:{intro:'O medo é uma forma de proteção. A diferença está em não deixar que ele defina todos os seus caminhos.',interpretation:'Suas respostas sugerem que o medo pode estar ocupando um espaço importante na sua vida, como forma de evitar riscos ou situações novas. Ele pode aparecer como preocupação excessiva, antecipação de problemas, dificuldade para tomar decisões ou necessidade de ter certeza antes de avançar.',signs:['Pensamentos que começam com “e se...?”','Tendência a imaginar o pior cenário','Necessidade de controle','Evita oportunidades por receio das consequências'],effects:['Ansiedade e tensão constante','Dificuldade em tomar decisões','Perda de oportunidades','Sensação de estagnação','Desgaste emocional'],path:'Desenvolver segurança interna antes de exigir de si coragem absoluta. Em vez de esperar o medo desaparecer, experimente se perguntar: “Qual é o menor passo seguro que posso dar mesmo sentindo medo?”',practices:['Respiração consciente (3 minutos, 2x ao dia)','Identifique o que o medo está tentando proteger','Faça pequenas ações fora da sua zona de conforto','Registre seus avanços, por menores que sejam'],quote:'Coragem não é a ausência do medo, mas a decisão de seguir em frente, mesmo sentindo.'},'INSEGURANÇA':{intro:'A insegurança pode fazer você duvidar do seu valor, mas não define quem você é. Reconhecer suas conquistas é o primeiro passo para se fortalecer.',interpretation:'Suas respostas indicam que a percepção sobre si mesmo pode estar interferindo em algumas escolhas. A insegurança pode surgir através da comparação, do medo de errar ou da necessidade de aprovação. Ao reconhecer isso, você pode resgatar sua confiança interna e agir com mais autenticidade.',signs:['Autocrítica intensa','Comparação frequente','Dificuldade em receber elogios','Necessidade de confirmação externa','Abandona ideias por duvidar de si'],effects:['Baixa autoestima','Perda de oportunidades','Dependência da aprovação alheia','Sensação de não ser suficiente','Desgaste emocional e frustração'],path:'Construir referências internas de valor. Antes de perguntar “será que vão aprovar?”, experimente perguntar: “Isso faz sentido para mim e está alinhado com quem quero ser?”',practices:['Registre 3 conquistas diárias (por menores que sejam)','Identifique e questione sua voz crítica','Pratique o autocuidado sem cobrança','Cerque-se de pessoas que te apoiam e valorizam'],quote:'Você não precisa ser perfeito, precisa ser verdadeiro.'},'PROCRASTINAÇÃO':{intro:'Não é preguiça. É um sinal de que algo precisa ser compreendido. Você pode avançar, no seu tempo, do seu jeito, com mais leveza.',interpretation:'Suas respostas sugerem uma tendência ao adiamento de determinadas ações. A procrastinação nem sempre significa falta de vontade. Ela pode aparecer quando uma tarefa desperta desconforto, medo de falhar, perfeccionismo, insegurança ou sensação de sobrecarga. É importante compreender o que acontece emocionalmente antes do adiamento.',signs:['Tarefas constantemente adiadas','Espera pelo “momento certo”','Dificuldade para começar','Muitas ideias e pouca execução','Sensação de culpa depois de adiar'],effects:['Acúmulo de responsabilidades','Ansiedade e estresse','Frustração com você mesmo','Perda de oportunidades','Sensação de estar sempre “atrasado”'],path:'Diminuir o tamanho psicológico da tarefa. Em vez de perguntar “como termino tudo?”, experimente: “qual parte disso consigo começar nos próximos dez minutos?”',practices:['Divida grandes tarefas em passos pequenos','Use a técnica dos 10 minutos (comece sem se cobrar tanto)','Elimine distrações no momento da ação','Celebre cada etapa concluída','Observe e acolha as emoções que surgem antes do adiamento'],quote:'Disciplina é escolher o que você mais quer, no lugar do que você quer agora.'}};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const list=a=>'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';(async()=>{const token=sessionStorage.getItem('admin_token');if(!token||sessionStorage.getItem('admin_role')!=='test')return location.replace('/admin-test.html');const id=new URLSearchParams(location.search).get('session_id');if(!id)return document.getElementById('app').innerHTML='<p class="err">Sessão de teste não informada.</p>';try{const r=await fetch('/api/admin-test',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({quiz_session_id:id})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Falha ao carregar teste.');const q=d.result,c=C[q.resultado_dominante];if(!c)throw new Error('Resultado não reconhecido.');const cls=q.resultado_dominante==='MEDO'?'medo':q.resultado_dominante==='INSEGURANÇA'?'inseguranca':'';const quoteCls=q.resultado_dominante==='INSEGURANÇA'?'purple':q.resultado_dominante==='PROCRASTINAÇÃO'?'green':'';const msg=`Olá, Janaína! Fiz o Mini Diagnóstico e gostaria de aprofundar meu resultado: ${q.resultado_dominante}. Você pode me orientar?`;document.getElementById('app').innerHTML='<header class="hero '+cls+'"><img class="logo" src="/ja-logo-approved.webp" alt="Janaína Araújo"><div class="mini">Mini Diagnóstico</div><div class="tag">SUAS RESPOSTAS, SEU MAPA INTERIOR</div><p class="hello">Olá, '+esc(q.nome)+'.</p><p class="label">SEU PADRÃO PREDOMINANTE É:</p><h1>'+esc(q.resultado_dominante)+'</h1><p class="intro">'+esc(c.intro)+'</p></header><main class="body"><section class="box"><h3>◉ &nbsp; INTERPRETAÇÃO DO SEU RESULTADO</h3><p>'+esc(c.interpretation)+'</p></section><div class="grid"><section class="box"><h3>● &nbsp; SINAIS COMUNS</h3>'+list(c.signs)+'</section><section class="box"><h3>▲ &nbsp; O QUE ISSO PODE CAUSAR</h3>'+list(c.effects)+'</section></div><section class="box path"><h3>♧ &nbsp; SEU CAMINHO DE TRANSFORMAÇÃO</h3><p>'+esc(c.path)+'</p></section><section class="box practices"><h3>✓ &nbsp; PRÁTICAS SUGERIDAS</h3>'+list(c.practices)+'</section><section class="box quote '+quoteCls+'">“ '+esc(c.quote)+' ”</section><div class="actions"><a class="wa" href="https://wa.me/5521983928113?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener noreferrer">◉ &nbsp; QUERO APROFUNDAR MEU<br>RESULTADO COM JANAÍNA</a><a class="pdf" href="#" onclick="window.print();return false">⇩ &nbsp; BAIXAR MEU RESULTADO EM PDF</a></div></main><footer class="footer"><b>Janaína Araújo</b><span>TERAPEUTA INTEGRATIVA</span><span>AUTOCONHECIMENTO &nbsp; • &nbsp; EQUILÍBRIO &nbsp; • &nbsp; TRANSFORMAÇÃO</span><small>JUNTOS SOMOS MELHORES ♡</small></footer>'}catch(e){document.getElementById('app').innerHTML='<p class="err">'+esc(e.message||'Falha ao carregar teste.')+'</p>'}})();</script></body></html>

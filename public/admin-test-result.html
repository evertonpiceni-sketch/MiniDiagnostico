<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Resultado de Teste</title><style>body{margin:0;background:#f6f1ed;color:#302535;font-family:Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:28px 16px}.card{background:#fff;border-radius:24px;padding:28px;box-shadow:0 18px 60px #3c24451c}h1,h2{font-family:Georgia,serif;color:#4d244f;text-align:center}.badge{display:block;width:max-content;max-width:90%;margin:0 auto 18px;background:#4d244f;color:#fff;padding:8px 13px;border-radius:99px;font-size:11px;font-weight:700}.intro{text-align:center;line-height:1.6}.box{background:#faf7f8;border:1px solid #eadfe7;border-radius:16px;padding:18px;margin-top:15px;line-height:1.6}.box h3{margin-top:0;color:#4d244f}.box li{margin:8px 0}.quote{background:#4d244f;color:white;text-align:center;font-family:Georgia,serif;font-style:italic}.actions{display:grid;gap:10px;margin-top:18px}.actions a{padding:14px;border-radius:12px;text-align:center;text-decoration:none;font-weight:700;background:#4d244f;color:#fff}.actions a:last-child{background:#eee6eb;color:#4d244f}.err{color:#a32929;text-align:center}</style></head><body><div class="wrap"><div class="card" id="app"><span class="badge">MODO TÉCNICO • PAGAMENTO SIMULADO • ASAAS NÃO ACIONADO</span><p class="intro">Carregando resultado de teste...</p></div></div><script>const C={MEDO:{intro:'O medo é uma forma de proteção. A diferença está em não deixar que ele defina todos os seus caminhos.',interpretacao:'Suas respostas sugerem que o medo pode estar ocupando um espaço importante na forma como você reage a determinadas situações. Ele pode aparecer como preocupação excessiva, antecipação de problemas, dificuldade para tomar decisões ou necessidade de ter certeza antes de avançar.',sinais:['Pensamentos que começam com “e se...?”','Tendência a imaginar o pior cenário','Necessidade de controle','Evita oportunidades por receio das consequências'],causa:['Ansiedade e tensão constante','Dificuldade em tomar decisões','Perda de oportunidades','Sensação de estagnação','Desgaste emocional'],caminho:'Desenvolver segurança interna antes de exigir de si coragem absoluta. Em vez de esperar o medo desaparecer, experimente perguntar: “Qual é o menor passo seguro que posso dar mesmo sentindo medo?”',praticas:['Respiração consciente (3 minutos, 2x ao dia)','Identifique o que o medo está tentando proteger','Faça pequenas ações fora da sua zona de conforto','Registre seus avanços, por menores que sejam'],quote:'Coragem não é a ausência do medo, mas a decisão de seguir em frente, mesmo sentindo.'},'INSEGURANÇA':{intro:'A insegurança pode fazer você duvidar do seu valor, mas não define quem você é. Reconhecer suas conquistas é o primeiro passo para se fortalecer.',interpretacao:'Suas respostas indicam que a percepção sobre si mesmo pode estar interferindo em algumas escolhas. A insegurança pode surgir através da comparação, do medo de errar ou da necessidade de aprovação.',sinais:['Autocrítica intensa','Comparação frequente','Dificuldade em receber elogios','Necessidade de confirmação externa','Abandona ideias por duvidar de si'],causa:['Baixa autoestima','Perda de oportunidades','Dependência da aprovação alheia','Sensação de não ser suficiente','Desgaste emocional e frustração'],caminho:'Construir referências internas de valor. Antes de perguntar “será que vão aprovar?”, experimente perguntar: “Isso faz sentido para mim e está alinhado com quem quero ser?”',praticas:['Registre 3 conquistas diárias','Identifique e questione sua voz crítica','Pratique o autocuidado sem cobrança','Cerque-se de pessoas que te apoiam e valorizam'],quote:'Você não precisa ser perfeito, precisa ser verdadeiro.'},'PROCRASTINAÇÃO':{intro:'Não é preguiça. É um sinal de que algo precisa ser compreendido. Você pode avançar, no seu tempo, do seu jeito, com mais leveza.',interpretacao:'Suas respostas sugerem uma tendência ao adiamento de determinadas ações. A procrastinação nem sempre significa falta de vontade. Ela pode aparecer quando uma tarefa desperta desconforto, medo de falhar, perfeccionismo, insegurança ou sensação de sobrecarga.',sinais:['Tarefas constantemente adiadas','Espera pelo “momento certo”','Dificuldade para começar','Muitas ideias e pouca execução','Sensação de culpa depois de adiar'],causa:['Acúmulo de responsabilidades','Ansiedade e estresse','Frustração com você mesmo','Perda de oportunidades','Sensação de estar sempre “atrasado”'],caminho:'Diminuir o tamanho psicológico da tarefa. Em vez de perguntar “como termino tudo?”, experimente: “Qual parte disso consigo começar nos próximos dez minutos?”',praticas:['Divida grandes tarefas em passos pequenos','Use a técnica dos 10 minutos','Elimine distrações no momento da ação','Celebre cada etapa concluída','Observe e acolha as emoções antes do adiamento'],quote:'Disciplina é escolher o que você mais quer, no lugar do que você quer agora.'}};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const list=a=>'<ul>'+a.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';(async()=>{const token=sessionStorage.getItem('admin_token');if(!token||sessionStorage.getItem('admin_role')!=='test')return location.replace('/admin-test.html');const id=new URLSearchParams(location.search).get('session_id');try{const r=await fetch('/api/admin-test',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({quiz_session_id:id})}),d=await r.json();if(!r.ok)throw new Error(d.error);const q=d.result,c=C[q.resultado_dominante];document.getElementById('app').innerHTML='<span class="badge">MODO TÉCNICO • PAGAMENTO SIMULADO • ASAAS NÃO ACIONADO</span><p class="intro">Olá, '+esc(q.nome)+'.</p><p class="intro">SEU PADRÃO PREDOMINANTE É:</p><h1>'+esc(q.resultado_dominante)+'</h1><p class="intro">'+esc(c.intro)+'</p><div class="box"><h3>INTERPRETAÇÃO DO SEU RESULTADO</h3>'+esc(c.interpretacao)+'</div><div class="box"><h3>SINAIS COMUNS</h3>'+list(c.sinais)+'</div><div class="box"><h3>O QUE ISSO PODE CAUSAR</h3>'+list(c.causa)+'</div><div class="box"><h3>SEU CAMINHO DE TRANSFORMAÇÃO</h3>'+esc(c.caminho)+'</div><div class="box"><h3>PRÁTICAS SUGERIDAS</h3>'+list(c.praticas)+'</div><div class="box quote">“'+esc(c.quote)+'”</div><div class="actions"><a href="/?test_mode=1">FAZER NOVO TESTE</a><a href="/admin-test.html" onclick="sessionStorage.clear()">SAIR DO MODO DE TESTE</a></div>'}catch(e){document.getElementById('app').innerHTML='<span class="badge">MODO TÉCNICO</span><p class="err">'+esc(e.message||'Falha ao carregar teste.')+'</p>'}})();</script></body></html>

name: CI

on:
  push:
    branches: [launch-hardening-2026-09-03, main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run lint

      - name: Production build
        run: bun run build
